name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest
      - name: Build add-in zip
        run: python tools/build_release.py --tag "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (e.g. created by hand or via the API);
          # then just refresh its zip and notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "djr_batchpost ${GITHUB_REF_NAME}" \
              --notes-file dist/RELEASE_NOTES.md
          fi
